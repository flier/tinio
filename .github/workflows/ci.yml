name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # sccache: object-level compile cache shared across same-OS jobs via the
  # Actions cache service (SCCACHE_GHA_ENABLED); CARGO_INCREMENTAL=0 for
  # wrapper hits (the action installs sccache and exports it on PATH).
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache
  CARGO_INCREMENTAL: "0"
  # Toolchain pins. Stable is pinned because sccache cache keys include the
  # rustc version — a moving "stable" channel invalidates the whole store
  # every ~6 weeks. Nightly is used only for rustfmt (no sccache), so it
  # stays on the moving channel unless a pinned date is desired for a fully
  # deterministic fmt gate.
  RUST_STABLE: "1.98.1"
  RUST_NIGHTLY: "nightly"

permissions:
  # Job default for every job (unlisted scopes = none): checkout needs
  # contents: read, or cloning this private repo 404s ("not found"). A
  # job-level permissions block REPLACES this default, so the two jobs
  # that need more (e2e, interop — PR report comment) re-list
  # contents: read in their own blocks.
  contents: read

# ---------------------------------------------------------------------------
# Shared steps. A step shared across jobs is defined ONCE as a YAML anchor
# at its first real use (`- &name`, in the earliest job below that runs it
# — GitHub's workflow schema rejects unknown top-level keys, so a synthetic
# anchor-holder block like `x-steps` is not an option) and aliased
# (`- *name`) by every later job; the rationale for each shared step lives
# at its definition site instead of being copied around. Aliases expand
# textually, so each job keeps full native context (runner.os, matrix,
# github.* expressions). GitHub does NOT support YAML merge keys (`<<:`) —
# an aliased step cannot be overridden per job; a step that needs per-job
# variation stays inline (or becomes a composite action, like
# run-test-leg).
# ---------------------------------------------------------------------------

jobs:
  # Check is the single prerequisite gate and the definition site for the
  # shared preamble steps (checkout/lld/toolchain/rust-cache/sccache):
  # they are inlined here with their anchors, and every later job aliases
  # them (*checkout, *lld, *toolchain, *rust-cache, *sccache).
  check:
    name: Check (workspace compile)
    # The single prerequisite of every gate: one ubuntu leg proves the
    # tree compiles before the 3-OS matrices and external-client
    # scenarios spend their runners; the full clippy matrix in lint
    # stays the quality gate.
    runs-on: ubuntu-latest
    steps:
      - &checkout
        uses: actions/checkout@v7
        with:
          lfs: true

      # Linux links through clang + lld (.cargo/config.toml); the hosted
      # ubuntu image ships clang but not lld.
      - &lld
        name: install lld (linux linker)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y lld

      # Plain stable toolchain, shared by every job except lint and the macOS
      # clippy step in test-port — each adds the clippy component itself
      # (both below).
      - &toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_STABLE }}

      # rust-cache, registry-only (cache-targets off): per-job target/
      # dirs never serve the cross-job chain (sccache carries that) and
      # dominated cache-store pressure. Only test (the ubuntu chain head)
      # keeps its target dir.
      - &rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      # Object-level compile cache (sccache) — shares hits across the
      # same-OS jobs via the Actions cache service.
      - &sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: check (all targets)
        run: cargo check --profile ci --workspace --all-targets

  # Lint and tests are separate jobs so a clippy failure never blocks the
  # test legs — both matrices run in parallel and report independently.
  fmt:
    name: fmt (rustfmt)
    # fmt is platform-neutral and non-compiling (rustfmt parses source, no
    # codegen), so it does not wait on the compile gate — an independent
    # fast gate next to clippy. Nightly rustfmt for rustfmt.toml
    # unstable_features.
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUST_NIGHTLY }}
          components: rustfmt
      - name: fmt --check
        run: cargo +nightly fmt --all -- --check

  lint:
    name: Lint (clippy)
    # All gates run behind the lightweight compile check: a tree that
    # does not build skips the 3-OS matrices instead of burning them.
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # 2 clippy runs, both on ubuntu. The unix leg lints linux, and that
        # does NOT cover macos: the workspace carries macOS-only code behind
        # cfg(target_os = "macos") — crates/tinio-fs/src/fsutil.rs's o_nofollow()
        # today, and the whole tinio-sandbox-macos backend — which a
        # linux compile never builds, so the macos-latest leg of test-port lints
        # it natively instead. The windows-gnu leg cross-lints the cfg(windows)
        # code; the msvc-native clippy legs are dropped (their compile coverage
        # already comes from the test-port matrix).
        target:
          - unix
          - windows-gnu
    runs-on: ubuntu-latest
    steps:
      - *checkout

      - *lld

      # windows-gnu cross needs the mingw C toolchain (alloca/criterion's
      # cc-rs compiles a C shim for --target) and the windows-gnu rust-std.
      - name: install mingw cross compiler (windows-gnu)
        if: matrix.target == 'windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      # Lint installs stable with the clippy component; the shared stable
      # toolchain step (*toolchain) is defined in the check job above.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_STABLE }}
          components: clippy

      # windows-gnu rust-std for the (now-default) stable toolchain clippy uses.
      - name: add windows-gnu target
        if: matrix.target == 'windows-gnu'
        run: rustup target add x86_64-pc-windows-gnu

      - *rust-cache

      - *sccache

      # clippy: the unix leg keeps sccache — it reads the warm linux cache
      # (297 hits on the first run, a real win). The windows-gnu leg is a
      # cold cross target (0 hits), so it bypasses sccache entirely by
      # clearing RUSTC_WRAPPER — avoids writing ~324 cold objects into the
      # shared ~200/min write budget where they mostly fail anyway.
      - name: clippy (-D warnings)
        run: cargo clippy ${{ matrix.target == 'windows-gnu' && '--target x86_64-pc-windows-gnu' || '' }} --profile ci --workspace --all-targets -- -D warnings
        env:
          RUSTC_WRAPPER: ${{ matrix.target == 'unix' && 'sccache' || '' }}

  test:
    name: Test (unit/features, default)
    # Ubuntu default-features leg ONLY: it owns the fast gates and its
    # profile-ci artifacts (workspace libs + dev-deps incl. criterion) warm
    # the sccache/rust-cache stores the chain reuses — e2e/bench-smoke chain
    # behind THIS job, so they never wait on the no-default leg
    # (test-no-default) or the windows/macos legs (test-port), which compile
    # different graphs and warm nothing downstream.
    needs: check
    strategy:
      fail-fast: false
      matrix:
        target: [default]
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *lld

      # Plain stable toolchain, shared by every job except lint and the macOS
      # clippy step in test-port — each adds the clippy component itself
      # (lint above, that step below).
      - *toolchain

      # Chain head: test keeps its full target dir (the e2e/interop/
      # bench-smoke chain rides these artifacts); every other job runs
      # rust-cache registry-only (*rust-cache). Single leg, so it is also
      # the single writer — no save-if needed.
      - uses: Swatinem/rust-cache@v2

      - *sccache

      # One matrix leg per call: the action switches on the leg's mode
      # (default / no-default / doc) — single source of truth shared by
      # all three test jobs.
      - uses: ./.github/actions/run-test-leg
        with:
          mode: ${{ matrix.target }}

  # Parquet (select-parquet) is compiled by NO default-feature graph: the
  # workspace legs, both cucumber passes and the docs leg all run without
  # it, and the feature-matrix job only cargo-hack *checks* tinio-server
  # (--no-dev-deps, no test execution). So the parquet reader and its
  # server-side path would never run in CI. This job owns every
  # parquet-gated test surface: the reader's unit + integration tests, the
  # server's parquet select test, and the @parquet cucumber scenario.
  test-parquet:
    name: Test (select-parquet)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *lld
      - *toolchain
      - *rust-cache
      - *sccache

      - name: install nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      # The `tinio` binary is a PREREQUISITE of the `-p tinio-server` targets
      # that spawn it (`sandbox_e2e*`; the read-only CLI legs are `@cli`
      # cucumber scenarios since 2026-10-01, and `serve_sandbox_channels.rs`
      # retired with `serve_read_only.rs`).
      # A spawned run needs the binary present, and
      # `assert_cmd::cargo::cargo_bin("tinio")` resolves it in the running
      # test binary's own profile dir — so the build profile here must match
      # the test profile (both use --profile ci), and nextest's target
      # selection is not relied on to leave the artifact there. This job's
      # cache is registry-only (`cache-targets: "false"`), so nothing else
      # could: the build is the only thing that puts `target/ci/tinio` on
      # this runner, exactly as the shared action does for the default leg.
      - name: build the tinio binary (a spawning-target prerequisite)
        run: cargo build --profile ci -p tinio

      # Same cargo/runner profile flags as run-test-leg's default leg — the
      # feature is the only difference. nextest runs no doctests, which
      # `run-test-leg`'s separate --doc step covers for the default graph.
      - name: test (parquet reader + server)
        run: |
          cargo nextest run --cargo-profile ci --profile ci -p tinio-select --features parquet
          cargo nextest run --cargo-profile ci --profile ci -p tinio-server --features select-parquet

      # --test cucumber keeps the args off the plain-harness traceability
      # target; an explicit --tags replaces the runner's default filter, so
      # this pass is exactly the @parquet scenario and nothing else.
      - name: e2e cucumber (@parquet)
        run: cargo test --profile ci -p tinio-e2e --features parquet --test cucumber -- --tags '@parquet' --retry 2

  # The no-default-features and rustdoc legs: different compile graphs that
  # warm nothing downstream, so they run as a leaf job instead of holding
  # up the ubuntu chain (previously e2e/bench-smoke waited on them).
  test-no-default:
    name: Test (no-default features)
    needs: check
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *lld
      - *toolchain

      # Registry-only rust-cache (single leg — one writer, no race).
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - *sccache

      - uses: ./.github/actions/run-test-leg
        with:
          mode: no-default

  docs:
    name: Docs
    needs: check
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *lld
      - *toolchain

      # Registry-only rust-cache (single leg — one writer, no race).
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"

      - *sccache

      - uses: ./.github/actions/run-test-leg
        with:
          mode: doc

  # Windows/macOS unit legs: identical commands to the ubuntu test jobs,
  # run on the portable OSes for platform coverage. They run in parallel
  # with them — same graph, different target platform, so neither warms
  # the other. The rustdoc warnings gate runs on ubuntu (docs job):
  # rustdoc warnings are platform-neutral.
  test-port:
    name: Test (portable OS, unit/features)
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        target: [default, no-default]
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *lld
      - *toolchain

      # Registry-only rust-cache; per-OS single writer is the default leg
      # (parallel legs race one cache key).
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "false"
          save-if: ${{ matrix.target == 'default' }}

      - *sccache

      # macOS-only code is invisible to the ubuntu clippy job (see the lint
      # job's own comment), so this leg lints the workspace as well as testing
      # it. Native, not a cross-lint: the runner is already a Mac, so no SDK
      # and no cross toolchain is involved — the cross-lint route was measured
      # and rejected (a dependency's build script fails before this workspace's
      # code is reached; the measurement and the negative result are in
      # docs/superpowers/plans/2026-09-18-sandbox-p3-macos.md, Task 9 Step 7).
      # Gated to the default leg so it does not run twice, and the toolchain
      # anchor installs without clippy, hence the component add.
      - name: clippy (-D warnings, macOS-only code)
        if: matrix.os == 'macos-latest' && matrix.target == 'default'
        run: |
          rustup component add clippy
          cargo clippy --profile ci --workspace --all-targets -- -D warnings

      - uses: ./.github/actions/run-test-leg
        with:
          mode: ${{ matrix.target }}

  features:
    name: Feature matrix (tinio facade)
    needs: check
    # Feature-gate compile checks: every feature of the facade (and,
    # through its passthroughs, of tinio-server/tinio-cli/tinio-api)
    # must compile — catches feature-gate breakage early. cargo check
    # level, no dev-deps. --each-feature isolates every flag (plus the
    # no-default/default/all-features runs, ~12 checks); the powerset's
    # 2^9 combinations re-type-check the server crate hundreds of times
    # for little extra signal. Platform-neutral: one ubuntu leg, no
    # matrix.
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *lld
      - *toolchain
      - *rust-cache
      - *sccache

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: feature-matrix check (tinio)
        run: cargo hack check --package tinio --each-feature --no-dev-deps --profile ci

      # SelectObjectContent's feature combinations (P3): `select` and
      # `select-parquet` live on tinio-server (the facade passes nothing
      # through), so the facade matrix above never sees them — checked here
      # with the same no-dev-deps cargo-hack isolation.
      - name: feature-matrix check (tinio-server)
        run: cargo hack check --package tinio-server --each-feature --no-dev-deps --profile ci

      # tinio-fs's feature-off arm is invisible to every test graph: its
      # self dev-dependency (tinio-fs on itself, features = ["versioning"])
      # unifies the feature back ON whenever test targets build, so the
      # workspace no-default leg never compiles it. A cargo check builds no
      # dev-deps, so --each-feature's no-default-features run is that arm
      # without --no-dev-deps (which would only rewrite the real manifest
      # while cargo-hack runs).
      - name: feature-matrix check (tinio-fs)
        run: cargo hack check --package tinio-fs --each-feature --profile ci

      # tinio-mem carries the same self dev-dependency shape and the same
      # blind spot: its feature-off arm compiles only in a dev-dep-free
      # check.
      - name: feature-matrix check (tinio-mem)
        run: cargo hack check --package tinio-mem --each-feature --profile ci

  e2e:
    name: E2E (cucumber fs/mem + traceability)
    # Ubuntu cucumber legs chain behind the ubuntu test job: they compile
    # the same profile-ci default-features dep graph (tinio-e2e's workspace
    # deps), so cargo test warms them first. Windows/macos legs live in
    # e2e-port (parallel — different target platform, no sharing back);
    # this ubuntu job owns the PR test report comment.
    needs: test
    permissions:
      contents: read
      checks: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *lld
      - *toolchain
      - *rust-cache
      - *sccache

      # --- cucumber e2e suite (e2e and e2e-port) --------------------------
      # The `tinio` binary is a PREREQUISITE of the @cli scenarios, which
      # spawn it (`cli_lifecycle.feature`, `read_only.feature`, plus
      # `confinement.feature`'s sandbox channels): `assert_cmd::cargo::cargo_bin`
      # falls back to the profile dir
      # beside the test binary and does NOT build it, exactly as the
      # tinio-server targets that spawn it need (the run-test-leg
      # action's own build step). --profile ci keeps the binary in the same
      # profile dir this leg's test binary derives from its own location.
      - &e2e-build
        name: build the tinio binary (a @cli scenario prerequisite)
        run: cargo build --profile ci -p tinio

      # In-process scenarios; the runner's built-in default filter excludes
      # the feature-gated (@parquet), platform-bound (@linux/@macos/@windows/
      # @unix), external-client (@interop/@boto3/@mc) and host-bound
      # (@confinement off macOS) tags, so the fs pass needs no --tags. Which
      # confinement scenarios that leaves in this leg on macOS — and the arm
      # they take there — is docs/tests.md's fact (its macOS section owns the
      # selection, its CLI section the arm); this comment cites it rather than
      # restating it. The mem
      # pass skips @fs-only scenarios (traversal, nested-root, out-of-band);
      # backend-neutral scenarios run on mem via TINIO_E2E_BACKEND. --test
      # cucumber keeps the args from reaching the plain-harness traceability
      # target (its own step below), and an explicit --tags REPLACES the
      # runner's default filter, so the mem pass must repeat the platform,
      # external-tag and confinement exclusions itself — every platform tag,
      # not one host's non-matching set: this one list is shared by the ubuntu,
      # windows and macos runners (`e2e-port`), so what it may keep is what all
      # three may run, and the runner's compound platform clause cannot be
      # spelled once (tests/steps/tag_filter.rs).
      # --retry 2 on both passes: ConnectionAborted flakes on loaded legs
      # burned both retry-1 attempts in earlier runs (33764783657 fs,
      # 33750043137 mem).
      #
      # The guard keeps this step off e2e-port's macOS row, whose parallel pass
      # is the forced-exclude variant below. It lives here, not at the alias use:
      # GitHub expands aliases textually and supports no per-job override, and
      # this anchor also serves the single-OS ubuntu e2e job (no matrix), so it
      # names the runner rather than the matrix. The anchor itself stays free of
      # `TINIO_E2E_CONFINEMENT` — ubuntu and windows must keep running with the
      # variable unset (the platform default).
      - &e2e-fs
        name: e2e cucumber (fs backend)
        if: runner.os != 'macOS'
        run: cargo test --profile ci -p tinio-e2e --test cucumber -- --retry 2
        env:
          TINIO_E2E_REPORT: cucumber-report-fs.json

      - &e2e-mem
        name: e2e cucumber (mem backend)
        run: cargo test --profile ci -p tinio-e2e --test cucumber -- --tags 'not @fs and not @unix and not @windows and not @linux and not @macos and not @parquet and not @interop and not @boto3 and not @mc and not @confinement' --retry 2
        env:
          TINIO_E2E_BACKEND: mem
          TINIO_E2E_REPORT: cucumber-report-mem.json

      # The spec↔tag cross-check: a plain-harness libtest target, no
      # cucumber argv, so it cannot share the scoped runs above.
      - &e2e-trace
        name: e2e traceability
        run: cargo test --profile ci -p tinio-e2e --test traceability

      # PR test reports (BDD cucumber migration): the e2e/interop jobs write
      # JSON reports. Reports land in crates/tinio-e2e/ (cargo runs the test
      # binary with the package root as cwd), hence the ** glob.
      - &upload-report
        name: upload cucumber report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.job }}${{ matrix.os && format('-{0}', matrix.os) }}-cucumber-report
          path: '**/*-report*.json'

      # dorny/test-reporter has no cucumber reporter (its README documents
      # 13 reporter identifiers, none of them cucumber — verified
      # 2026-09-01), so this tier-3 fallback publishes the report: a step
      # summary plus a PR comment with pass/fail counts and the failed
      # scenario names. Never fails the job (fail-on-error: 'false' analog).
      # Included only by the two ubuntu jobs (e2e, interop) — the jobs that
      # hold the PR-comment permissions — so nothing gates on runner here.
      - &publish-report
        name: publish test report to PR
        if: always()
        uses: actions/github-script@v9
        with:
          script: |
            const publish = async ({ github, context, core }) => {
            const fs = require('fs');
            const path = require('path');

            // Find the cucumber JSON reports (same files the artifact
            // step uploads: *-report*.json anywhere in the workspace).
            function findReports(dir, acc) {
              for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
                if (entry.name === '.git' || entry.name === 'target') continue;
                const p = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  findReports(p, acc);
                } else if (/^.*-report.*\.json$/.test(entry.name)) {
                  acc.push(p);
                }
              }
              return acc;
            }

            const reports = findReports(process.env.GITHUB_WORKSPACE, []).sort();
            const rows = [];
            const failures = [];

            for (const file of reports) {
              let data;
              try {
                data = JSON.parse(fs.readFileSync(file, 'utf8'));
              } catch (err) {
                core.warning(`could not parse report ${file}: ${err.message}`);
                continue;
              }
              // A matched file that is valid JSON but not a cucumber report array
              // must skip with a warning, not throw — this step never fails the job.
              if (!Array.isArray(data)) {
                core.warning(`skipping ${file}: not a cucumber JSON array`);
                continue;
              }
              const row = { file: path.basename(file), scenarios: 0, passed: 0, failed: 0, skipped: 0 };
              for (const feature of data) {
                for (const el of feature.elements || []) {
                  if (el.type !== 'scenario') continue;
                  row.scenarios += 1;
                  // cucumber-rs 0.23's JSON writer accumulates events across
                  // retry attempts on the same element (steps are never
                  // cleared between attempts; element identity is
                  // name+line+type), so a flake recovered by --retry 2
                  // carries failed attempt-N statuses AND passed attempt-N+1
                  // statuses for the same step lines. Keep only the LAST
                  // status per step line (the gherkin position line is
                  // stable across attempts); hooks have no stable key in
                  // the JSON, so keep the last status per hook kind.
                  const statuses = new Set();
                  const lastByLine = new Map();
                  for (const step of el.steps || []) {
                    const status = step.result && step.result.status;
                    if (typeof step.line === 'number') {
                      lastByLine.set(step.line, status);
                    } else {
                      statuses.add(status);
                    }
                  }
                  for (const status of lastByLine.values()) {
                    statuses.add(status);
                  }
                  const lastHookByKind = new Map();
                  for (const kind of ['before', 'after']) {
                    for (const hook of el[kind] || []) {
                      lastHookByKind.set(kind, hook.result && hook.result.status);
                    }
                  }
                  for (const status of lastHookByKind.values()) {
                    statuses.add(status);
                  }
                  if (statuses.has('failed') || statuses.has('undefined') || statuses.has('ambiguous')) {
                    row.failed += 1;
                    failures.push(`- \`${feature.uri}\` — ${el.name}`);
                  } else if (statuses.size === 0 || (statuses.size === 1 && statuses.has('passed'))) {
                    row.passed += 1;
                  } else {
                    row.skipped += 1;
                  }
                }
              }
              rows.push(row);
            }

            const table = rows.length > 0
              ? ['| report | scenarios | passed | failed | skipped |', '|---|---|---|---|---|']
                .concat(rows.map((r) => `| ${r.file} | ${r.scenarios} | ${r.passed} | ${r.failed} | ${r.skipped} |`))
                .join('\n')
              : 'No cucumber report found — the e2e run did not produce a JSON report.';

            let note = '';
            if (failures.length > 0) {
              note = `\n**${failures.length} failed scenario(s):**\n${failures.join('\n')}`;
            } else if (rows.length > 0) {
              note = '\nAll scenarios passed.';
            }
            const body = [
              `## cucumber report (\`${process.env.GITHUB_JOB}\`)`,
              '',
              table,
              note,
            ].join('\n');

            // Step summary: visible on every run, including fork PRs
            // without comment permissions.
            await core.summary.addRaw(body).write();

            // PR comment (pull_request runs only — context.issue.number is
            // unset on push). A permission failure must not fail the job.
            if (context.issue.number) {
              try {
                await github.rest.issues.createComment({
                  ...context.repo,
                  issue_number: context.issue.number,
                  body,
                });
              } catch (err) {
                core.warning(`could not post PR comment: ${err.message}`);
              }
            }
            };
            await publish({ github, context, core });

  # Windows/macOS cucumber legs (parallel to the ubuntu e2e job): they
  # compile tinio-e2e for a different target platform, so they neither
  # warm nor are warmed by the ubuntu chain (test -> e2e -> interop).
  # They upload their reports as artifacts; the ubuntu e2e job owns the
  # PR comment. Gated on check only, so portable e2e coverage survives a
  # ubuntu unit-test failure.
  e2e-port:
    name: E2E (portable OS, cucumber fs/mem + traceability)
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *lld
      - *toolchain
      - *rust-cache
      - *sccache
      - *e2e-build
      - *e2e-fs

      # macOS parallel pass with the confinement family forced out, so the
      # serial leg below is its only run on this row: same command as the shared
      # anchor, which the guard at its definition skips on macOS, plus the `0`
      # state (`1`/`true` would force the family in anywhere; any other value
      # stops the run — tests/steps/tag_filter.rs owns the grammar).
      - name: e2e cucumber (fs backend, confinement excluded)
        if: matrix.os == 'macos-latest'
        run: cargo test --profile ci -p tinio-e2e --test cucumber -- --retry 2
        env:
          TINIO_E2E_CONFINEMENT: "0"
          TINIO_E2E_REPORT: cucumber-report-fs.json

      # macOS only: the default filter keeps `@confinement` on that host, and
      # the family's measured spelling is serial (`--concurrency 1`,
      # crates/tinio-e2e/README.md owns it). An explicit `--tags` replaces the
      # runner's composed filter, so the platform and external axes are
      # restated here (`tests/steps/tag_filter.rs` composes them).
      - name: e2e cucumber (macOS confinement, serial)
        if: matrix.os == 'macos-latest'
        run: cargo test --profile ci -p tinio-e2e --test cucumber -- --tags '@confinement and not @interop and not @boto3 and not @mc and not ((@linux or @macos or @windows or @unix) and not (@macos or @unix))' --retry 2 --concurrency 1

      - *e2e-mem
      - *e2e-trace
      - *upload-report

  bench-smoke:
    name: Benchmark smoke (criterion --test)
    # Chains behind the ubuntu test job (same platform, same profile-ci
    # default-features graph): cargo test has already compiled the
    # workspace libs and the criterion dev-deps, so this leg only builds
    # its bench targets — was 0% sccache hits and ~8 min cold while
    # running in parallel with the tests.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - *checkout
      - *lld
      - *toolchain
      - *rust-cache
      - *sccache

      # T030/T031: one-iteration criterion runs keep the fs-backend and
      # S3-mapping benches compilable and runnable. Baselines and
      # regression gating are Phase 6 (T088).
      - name: bench smoke
        run: cargo bench --profile ci -p tinio-fs -p tinio-server -- --test

  semver:
    name: Semver checks (tinio facade)
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *lld
      - *toolchain
      - *rust-cache
      - *sccache

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks

      # constitution VI: API changes MUST be checked with cargo-semver-checks.
      # check-release compares against the last published version on crates.io;
      # before the first release there is no baseline, so the check is skipped.
      - name: semver-checks (vs last published release)
        run: |
          ver=$(cargo metadata --no-deps --format-version 1 | \
            python -c "import json,sys; print(next(p['version'] for p in json.load(sys.stdin)['packages'] if p['name']=='tinio'))")
          # `cargo info` exits 0 for a never-published crate, so probe the
          # crates.io API instead: 404 = no published baseline yet.
          if curl -fsS -H "User-Agent: tinio-ci" \
            "https://crates.io/api/v1/crates/tinio/${ver}" >/dev/null 2>&1; then
            cargo semver-checks check-release --package tinio
          else
            echo "tinio@${ver} is not on crates.io yet — semver-checks baseline starts with the first release"
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # constitution VI: cargo audit runs on the release branch (main) and
    # the dev branch — vulnerability updates land during development, not
    # only at release time; the maintainer reviews the report.
    if: github.ref_name == 'main' || github.ref_name == 'dev'
    steps:
      - *checkout
      - *toolchain

      # No compile here at all (cargo audit parses Cargo.lock), so no
      # sccache-action, no rust-cache, no lld — their saves would churn
      # the Actions-cache store the sccache diagnostic is watching.

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  interop:
    name: Interop (aws cli v2 + rclone)
    # Ubuntu leg chains behind the ubuntu e2e job: both compile the same
    # tinio-e2e cucumber profile-ci test binary (e2e without @interop,
    # this leg with), so e2e warms this leg's compile. The `tinio` binary
    # builds under --profile ci so it shares the chain's artifacts
    # instead of the dev profile (which nothing else builds — cold every
    # run). Windows/macos legs live in interop-port; this ubuntu job owns
    # the PR test report comment.
    needs: e2e
    permissions:
      contents: read
      checks: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *lld
      - *toolchain
      - *rust-cache
      - *sccache

      # --- interop harness (interop and interop-port) ---------------------
      # aws cli v2 ships on all three hosted-runner images (install-action
      # has no aws-cli manifest — the old key failed the first real run);
      # rclone is the only tool to fetch.
      - &install-rclone
        uses: taiki-e/install-action@v2
        with:
          tool: rclone

      # The external-client presence checks want both clients; print the
      # versions for the log.
      - &interop-client
        name: client versions (interop harness)
        run: aws --version && rclone version

      # The external-client cucumber steps spawn the `tinio` binary;
      # `assert_cmd::cargo::cargo_bin("tinio")` resolves it in the running
      # test binary's own profile dir (<target>/<profile>), so the build
      # profile here must match the test profile — both use --profile ci.
      # The dev profile shared nothing else and recompiled cold every run.
      - &interop-example
        name: build the tinio binary (interop harness)
        run: cargo build --profile ci -p tinio

      # FR-025: aws cli v2 + rclone are the CI-gated clients. The cucumber
      # @interop run replaces the deleted bash scripts (e2e/interop/*.sh).
      # --test cucumber keeps the tags from reaching the plain-harness
      # traceability target; --retry 1 mitigates external-client flakes.
      # `and not @confinement` is load-bearing: an explicit --tags *replaces*
      # the runner's composed filter, so the bare @interop would sweep the
      # external clients' confined legs (interop/*.feature's `@confinement`
      # scenarios) into this job — and no hosted runner can confine a server
      # (ubuntu's AppArmor refuses the userns, macOS/Windows runners owe no
      # grant budget): those legs are the platform gates' and the operator's,
      # never CI's.
      - &interop-cucumber
        name: interop cucumber (@interop)
        run: cargo test --profile ci -p tinio-e2e --test cucumber -- --tags '@interop and not @confinement' --retry 1
        env:
          TINIO_E2E_REPORT: interop-report.json

      - *upload-report
      - *publish-report

  # Windows/macOS interop legs (parallel to the ubuntu interop job):
  # same external-client cucumber suite on the portable OSes, gated on
  # check only so interop coverage survives an ubuntu test/e2e failure.
  # Uploads reports as artifacts; the ubuntu interop job owns the PR
  # comment.
  interop-port:
    name: Interop (portable OS, aws cli v2 + rclone)
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - *checkout
      - *lld
      - *toolchain
      - *rust-cache
      - *sccache
      - *install-rclone
      - *interop-client
      - *interop-example
      - *interop-cucumber
      - *upload-report

  # The spike (spike/pg-meta) is the PostgreSQL gate D21 mandates, and it is a
  # separate cargo workspace (the root Cargo.toml excludes `spike`; the spike's
  # own Cargo.toml carries `[workspace]`). No job above can compile it, so when
  # a required method was added to the tinio-core metadata contracts the spike
  # stopped compiling while every workspace gate stayed green. This job is the
  # one thing that closes that gap — a compile check only. It needs no
  # database, no service container and no secrets: the full 8-leg gate (D21)
  # runs against a live postgres:18-alpine and is the operator's manual run,
  # never CI's.
  #
  # Un-gated (no `needs`), like fmt and semver: it is a seconds-long check on
  # an independent workspace, so waiting behind `check`'s full workspace
  # compile would defeat its purpose. The workflow has no path filters, so this
  # runs on every push to main/dev and every pull request, exactly like the
  # rest.
  pg-meta-check:
    name: Check (pg-meta spike compile)
    runs-on: ubuntu-latest
    steps:
      - *checkout
      - *lld
      - *toolchain
      - *rust-cache
      - *sccache

      # The root .cargo/config.toml pins clang + lld for
      # x86_64-unknown-linux-gnu (cargo discovers it from this cwd), and the
      # spike's build scripts/proc-macros link under it — hence *lld above,
      # as in the `check` job.
      # --manifest-path selects the spike's own workspace; its Cargo.lock is
      # committed (spike/pg-meta/Cargo.lock), so the resolved dependency set is
      # pinned. No --workspace/--profile ci: the spike is not a workspace
      # member and carries no `ci` profile.
      - name: check (pg-meta spike)
        run: cargo check --manifest-path spike/pg-meta/Cargo.toml
