name: Run workspace test matrix leg
description: >-
  Run one workspace unit/doc leg selected by `mode` (default /
  no-default / doc) — the exact commands the test matrix executes, shared
  as a single source of truth between the four jobs that run it (test,
  test-no-default, docs, test-port) so they can never drift.
  Unit/integration tests run under cargo-nextest (per-test processes;
  the runner profile's retry/fail-fast absorb their flakes);
  doctests are NOT supported by nextest and run separately with
  `cargo test --doc`. The cucumber e2e
  suite (crates/tinio-e2e, harness = false) runs in its own e2e job with
  report output — excluded here so it does not run twice (and does not
  accidentally run external-client scenarios).
inputs:
  mode:
    description: >-
      Which leg to run: 'default' (workspace tests), 'no-default'
      (workspace tests with --no-default-features), or 'doc' (rustdoc
      with -D warnings, no deps).
    required: true
runs:
  using: composite
  steps:
    - name: install nextest
      if: inputs.mode != 'doc'
      uses: taiki-e/install-action@v2
      with:
        tool: nextest

    # The `tinio` binary is a PREREQUISITE of tinio-server's serve_read_only
    # integration test, which spawns it. `cargo test` (the local gate) leaves
    # the built binary at `<profile>/tinio`, which is where
    # `assert_cmd::cargo::cargo_bin("tinio")` looks; nextest's target
    # selection is not something this leg can rely on to do the same, and the
    # difference is a red leg either way. `--profile ci` keeps the binary in
    # the same profile dir the test derives from its own location.
    #
    # The feature flags MATCH THE LEG: a plain `-p tinio` build would put a
    # DEFAULT-features server at that path and the no-default leg would then
    # spawn a binary with an `acl` stack its own test graph does not have —
    # the artifact under test must be the one the leg builds.
    - name: build the tinio binary (a serve_read_only prerequisite)
      if: inputs.mode == 'default'
      shell: bash
      run: cargo build --profile ci -p tinio

    - name: build the tinio binary (--no-default-features)
      if: inputs.mode == 'no-default'
      shell: bash
      run: cargo build --profile ci -p tinio --no-default-features

    # --cargo-profile ci = the Cargo compile profile ([profile.ci] in the
    # root Cargo.toml). --profile ci = the nextest runner profile
    # (.config/nextest.toml): fail-fast off keeps CI parity with cargo
    # test (report every failure), retries 2 absorbs per-process flakes
    # (each test runs in its own process under nextest, surfacing timing
    # races one shared process hid). Runner and Cargo profiles are
    # independent.
    - name: test (default features)
      if: inputs.mode == 'default'
      shell: bash
      run: cargo nextest run --cargo-profile ci --profile ci --workspace --exclude tinio-e2e

    - name: doctests (default features)
      if: inputs.mode == 'default'
      shell: bash
      run: cargo test --doc --profile ci --workspace --exclude tinio-e2e

    - name: test (--no-default-features)
      if: inputs.mode == 'no-default'
      shell: bash
      run: cargo nextest run --cargo-profile ci --profile ci --workspace --no-default-features --exclude tinio-e2e

    - name: doctests (--no-default-features)
      if: inputs.mode == 'no-default'
      shell: bash
      run: cargo test --doc --profile ci --workspace --no-default-features --exclude tinio-e2e

    - name: doc (no warnings)
      if: inputs.mode == 'doc'
      shell: bash
      env:
        RUSTDOCFLAGS: -D warnings
      run: cargo doc --profile ci --workspace --no-deps
