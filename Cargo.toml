[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["vendor/soft-canonicalize"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
arrow = { version = "60", default-features = false }
assert_cmd = "2"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
bytes = "1"
bzip2 = "0.6"
cfg-if = "1"
clap = { version = "4.6", default-features = false }
criterion = { version = "0.8", default-features = false }
csv = "1.3"
cucumber = "0.23"
daemonize = "0.5"
delegate = "0.13"
derive_more = "2"
dirs = "7"
dotenvy = "0.15"
either = "1"
flate2 = "1.0"
futures = "0.3"
garde = "0.23"
getrandom = "0.4"
getset = "0.1"
handlebars = "6"
hex = "0.4"
hmac = "0.13"
http = "1"
http-body = "1"
http-body-util = "0.1"
humantime-serde = "1.1"
hyper = "1.1"
hyper-util = "0.1"
lazy_static = "1"
libc = "0.2"
linux-raw-sys = "0.12"
md-5 = "0.11"
mime_guess = "2.0"
moka = "0.12"
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
opentelemetry-otlp = "0.33"
papaya = "0.2"
parquet = "60"
parse-display = "0.11"
percent-encoding = "2.3"
pest = "2.7"
pest_derive = "2.7"
prometheus = "0.14"
proptest = "1.11"
rayon = "1"
redb = "4.2"
rust_decimal = "1"
rustix = "1.1"
rustls-pemfile = "2.2"
s3s = "0.17"
sd-notify = "0.5"
secrecy = "0.10"
service-manager = { version = "0.11", default-features = false }
serde = "1"
serde_ignored = "0.1"
serde_json = "1.0"
sha1 = "0.11"
sha2 = "0.11"
signal-hook = "0.4"
smart-default = "0.7"
soft-canonicalize = "0.5"
sqlparser = "0.63"
sse-core = { version = "0.2", default-features = false }
strict-path = "0.2"
struson = "0.7"
tempfile = "3.27"
thiserror = "2.0"
thread-priority = "3.1"
time = "0.3"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false }
toml = "1.1"
tower = "0.5"
tracing = "0.1"
tracing-opentelemetry = "0.34"
tracing-subscriber = "0.3"
unicode-properties = { version = "0.1", default-features = false }
utoipa = { version = "6", default-features = false }
uuid = "1"
winapi-util = "0.1"
windows-service = "0.8"
windows-sys = "0.61"

tinio-api = { path = "crates/tinio-api", default-features = false }
tinio-auth = { path = "crates/tinio-auth" }
tinio-cli = { path = "crates/tinio-cli", default-features = false }
tinio-config = { path = "crates/tinio-config" }
tinio-core = { path = "crates/tinio-core" }
tinio-fs = { path = "crates/tinio-fs" }
tinio-mem = { path = "crates/tinio-mem" }
tinio-sandbox = { path = "crates/tinio-sandbox" }
tinio-sandbox-core = { path = "crates/tinio-sandbox-core" }
tinio-sandbox-linux = { path = "crates/tinio-sandbox-linux" }
tinio-sandbox-macos = { path = "crates/tinio-sandbox-macos" }
tinio-sandbox-windows = { path = "crates/tinio-sandbox-windows" }
tinio-select = { path = "crates/tinio-select" }
tinio-server = { path = "crates/tinio-server", default-features = false }
tinio-store = { path = "crates/tinio-store" }
tinio-util = { path = "crates/tinio-util" }
tinio-winsec = { path = "crates/tinio-winsec" }

[patch.crates-io]
soft-canonicalize = { path = "vendor/soft-canonicalize" }

# CI compile profile: no debug info, wide codegen parallelism, no
# incremental — the CI cargo runs below pass --profile ci. Local dev
# keeps the dev profile (trimmed debug below) and `--profile debugging`
# for full debug info when needed.
[profile.ci]
inherits = "dev"
debug = false
codegen-units = 16
incremental = false

[profile.dev]
# Panic backtraces stay readable for workspace crates only.
debug = "line-tables-only"

[profile.dev.package."*"]
# Dependencies compile without debug info.
debug = false

[profile.debugging]
inherits = "dev"
debug = true
