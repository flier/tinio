[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

# Every dependency version is declared here (project convention — see
# CLAUDE.md "Cargo Workspace Conventions"); crates reference them with
# `X.workspace = true`. Versions are major.minor only, sorted alphabetically.
# Local tinio-* path dependencies are the only exception (never versioned).
[workspace.dependencies]
axum = "0.8"
clap = { version = "4.6", features = ["derive"] }
criterion = "0.8"
dhat = "0.3"
dirs = "6.0"
dotenvy = "0.15"
hyper = "1.1"
hyper-util = "0.1"
md-5 = "0.11"
mime_guess = "2.0"
opentelemetry = "0.32"
opentelemetry-otlp = "0.32"
prometheus = "0.14"
proptest = "1.11"
rustls-pemfile = "2.2"
s3s = "0.14" # stable line; 0.15 is still in alpha (research.md §1)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
time = "0.3"
tokio = { version = "1.53", features = ["full"] }
tokio-rustls = "0.26"
tokio-util = "0.7"
toml = "1.1"
tracing = "0.1"
tracing-opentelemetry = "0.33"
tracing-subscriber = "0.3"
utoipa = "5.5"
uuid = { version = "1.24", features = ["v4"] }
windows-sys = "0.61"
