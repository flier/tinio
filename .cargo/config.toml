# Linux builds link through clang + lld (CI ubuntu and WSL2): much faster
# linking than the default ld. Needs lld installed (CI installs it;
# WSL2: apt install lld).
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[alias]
xtask = "run --package xtask --"

# sqlx macros read the committed .sqlx cache. A command that must describe
# statements against a live database sets SQLX_OFFLINE=false itself; this
# entry does not force, so that value wins.
[env]
SQLX_OFFLINE = "true"
