[package]
name = "tinio-sandbox-windows"
version.workspace = true
edition.workspace = true
description = "Windows AppContainer confinement for tinio: DACL whitelist, container launch, signal relay"
publish = false

[dependencies]
getrandom.workspace = true
hex.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
time = { workspace = true, features = ["formatting"] }
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "rt"] }
tracing.workspace = true
# **Optional, and on the `testing` feature, because what wants it is lib code**: the
# recording harness in `src/testing.rs` is built on it, and that module has to be lib
# code to cross the `tests/` boundary at all — so the `[dev-dependencies]` edge it
# used to sit on could not reach the module. Off by default, it rides in no build but
# a test build of this crate or of a suite that asks for `testing`.
tracing-subscriber = { workspace = true, optional = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

tinio-sandbox-core.workspace = true
tinio-util.workspace = true
tinio-winsec.workspace = true

[dev-dependencies]
# The crate's own suites reach `tinio_sandbox_windows::testing` (`src/testing.rs`),
# and that module is behind this crate's `testing` feature — hence the self
# dev-dependency, which is what turns the feature on for a test build without
# turning it on for anyone who merely depends on this crate. Cargo unifies the two
# edges, so the lib under test and this edge are one build.
tinio-sandbox-windows = { path = ".", features = ["testing"] }

[features]
# **Conformance support, and not part of a production build of this crate.** The
# `testing` module (the harness `tinio-server`'s Windows e2e suite and this crate's
# own suites compose) is compiled only when this feature is on, and the feature is
# what pulls `tinio-util`'s own `testing` module in, together with the subscriber
# `src/testing.rs`'s recording device writes through — so the devices a test needs
# never ride into a consumer's build, and the `[dependencies]` edges stay what
# `docs/tests.md` asks for. `default` is empty for the same reason: the launcher
# and the server never want it.
testing = ["tinio-util/testing", "dep:tempfile", "dep:tracing-subscriber"]

[lints.clippy]
absolute_paths = "warn"

[lints.rust]
unsafe_code = "deny"
