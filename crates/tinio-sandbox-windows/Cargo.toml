[package]
name = "tinio-sandbox-windows"
version.workspace = true
edition.workspace = true
description = "Windows AppContainer confinement for tinio: DACL whitelist, container launch, signal relay"
publish = false

[dependencies]
derive_more = { workspace = true, features = ["deref"] }
getrandom.workspace = true
hex.workspace = true
sha2.workspace = true
tempfile = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "rt"] }
tracing.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

tinio-sandbox-core.workspace = true
tinio-util.workspace = true

[dev-dependencies]
tinio-sandbox-windows = { path = ".", features = ["testing"] }

[features]
testing = ["tinio-util/testing", "dep:tempfile"]

[lints.clippy]
absolute_paths = "warn"
allow_attributes = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

[lints.rust]
unsafe_code = "deny"
