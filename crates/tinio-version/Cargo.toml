[package]
name = "tinio-version"
version.workspace = true
edition.workspace = true
description = "The shared version state machine for tinio: supersede, materialize and the version rows, over the persistence and content contracts"
publish = false

[dependencies]
async-trait.workspace = true
parse-display.workspace = true
prometheus.workspace = true
thiserror.workspace = true
tracing.workspace = true

tinio-blob.workspace = true
tinio-core.workspace = true
tinio-util.workspace = true

[dev-dependencies]
bytes.workspace = true
futures.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tracing-subscriber.workspace = true
tinio-util = { workspace = true, features = ["testing"] }

[lints.clippy]
absolute_paths = "warn"
allow_attributes = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

[lints.rust]
unsafe_code = "forbid"
