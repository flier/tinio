[package]
name = "tinio-version"
version.workspace = true
edition.workspace = true
description = "The shared version state machine for tinio: supersede, materialize and the version rows, over the persistence and content contracts"
publish = false

[dependencies]
async-trait.workspace = true
thiserror.workspace = true

tinio-blob.workspace = true
tinio-core.workspace = true

[dev-dependencies]
bytes.workspace = true
futures.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints.clippy]
absolute_paths = "warn"

[lints.rust]
unsafe_code = "forbid"
