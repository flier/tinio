[package]
name = "tinio-select"
version.workspace = true
edition.workspace = true
description = "Streaming SQL SELECT engine for S3 objects (S3 Select)"
publish = false

[dependencies]
arrow = { version = "56", default-features = false, optional = true } # parquet 56's ChunkReader has no Cursor impl — arrow types are the reader's output types
bzip2.workspace = true
bytes.workspace = true # parquet 56's ChunkReader is implemented for bytes::Bytes only (no AsRef blanket)
csv.workspace = true
flate2.workspace = true
parquet = { workspace = true, optional = true } # review 2026-09-05b: declared optional here (not in workspace.dependencies, RFC 2906) so [features] parquet = ["dep:parquet"] resolves
rust_decimal.workspace = true
serde_json = { workspace = true, features = ["arbitrary_precision", "preserve_order"] }
sqlparser = { workspace = true, features = ["visitor"] } # referenced_columns walks Expr via the generated visitor
thiserror.workspace = true
time = { workspace = true, features = ["formatting"] } # RFC 3339 timestamp output (time 0.3.55: formatting is opt-in)

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "select_scan"
harness = false

[features]
default = []
parquet = ["dep:parquet", "dep:arrow"]

[lints.rust]
unsafe_code = "forbid"
