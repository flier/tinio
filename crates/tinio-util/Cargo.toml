[package]
name = "tinio-util"
version.workspace = true
edition.workspace = true
description = "Shared runtime utilities for tinio: the evicting per-key lock map used by backends and the server"
publish = false

[dependencies]
async-trait = { workspace = true, optional = true }
bytes.workspace = true
derive_more = { workspace = true, features = ["full"] }
dirs = { workspace = true, optional = true }
futures.workspace = true
handlebars = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
hmac = { workspace = true, optional = true }
papaya.workspace = true
prometheus.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "io-util", "net", "rt", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"] }

tinio-core.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "time",
] }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, optional = true, features = ["process"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[features]
bench = []
render = ["dep:handlebars"]
state = ["dep:dirs", "dep:thiserror", "dep:sha2", "dep:hex"]
testing = [
    "dep:async-trait",
    "dep:hmac",
    "dep:rustix",
    "dep:serde_json",
    "dep:sha2",
    "dep:tracing-subscriber",
]

[lints.clippy]
absolute_paths = "warn"
allow_attributes = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

[lints.rust]
unsafe_code = "deny"
