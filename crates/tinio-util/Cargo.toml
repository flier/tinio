[package]
name = "tinio-util"
version.workspace = true
edition.workspace = true
description = "Shared runtime utilities for tinio: the evicting per-key lock map used by backends and the server"
publish = false

[dependencies]
bytes.workspace = true
futures.workspace = true
papaya.workspace = true
serde_json = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"] }

tinio-core = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "time",
] }

[features]
testing = ["dep:tinio-core", "dep:serde_json", "tokio/time"]

[lints.clippy]
absolute_paths = "warn"

[lints.rust]
unsafe_code = "forbid"
