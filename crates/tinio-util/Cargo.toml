[package]
name = "tinio-util"
version.workspace = true
edition.workspace = true
description = "Shared runtime utilities for tinio: the evicting per-key lock map used by backends and the server"
publish = false

[dependencies]
bytes.workspace = true
derive_more = { workspace = true, features = ["full"] }
futures.workspace = true
handlebars = { workspace = true, optional = true }
papaya.workspace = true
proc-macro2 = { workspace = true, optional = true, features = ["span-locations"] }
secrecy = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
syn = { workspace = true, optional = true, features = ["full", "visit"] }
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v4"] }

tinio-core.workspace = true

[dev-dependencies]
syn = { workspace = true, features = ["full", "visit"] }
tempfile.workspace = true
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "time",
] }
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, optional = true, features = ["process"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[features]
render = ["dep:handlebars"]
testing = [
    "dep:proc-macro2",
    "dep:rustix",
    "dep:serde_json",
    "dep:syn",
    "dep:tracing-subscriber",
]

[[test]]
name = "spawn_guard"
required-features = ["testing"]

[lints.clippy]
absolute_paths = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

[lints.rust]
unsafe_code = "deny"
