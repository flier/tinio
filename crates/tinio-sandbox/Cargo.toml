[package]
name = "tinio-sandbox"
version.workspace = true
edition.workspace = true
description = "Process confinement for tinio: the facade over the per-platform backends"
publish = false

[dependencies]
prometheus.workspace = true
secrecy.workspace = true
tinio-sandbox-core.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tinio-sandbox-linux.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
tinio-sandbox-macos.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
tinio-sandbox-windows.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
tinio-util = { workspace = true, features = ["testing"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }

[lints.clippy]
absolute_paths = "warn"
allow_attributes = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

[lints.rust]
unsafe_code = "forbid"
