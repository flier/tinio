[package]
name = "tinio-sandbox"
version.workspace = true
edition.workspace = true
description = "Process confinement for tinio: the facade over the per-platform backends"
publish = false

[dependencies]
secrecy.workspace = true
tinio-sandbox-core.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
tinio-sandbox-linux.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
tinio-sandbox-macos.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
tinio-sandbox-windows.workspace = true

# The facade's test binds **every** name this crate re-exports, and the fork probe's
# `await_verdict` takes a pid as `rustix::process::Pid` — the one foreign type on that surface.
# `process` alone: nothing here forks, opens a pipe or sends a signal, it only names the type.
[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }

[lints.clippy]
absolute_paths = "warn"

[lints.rust]
unsafe_code = "forbid"
