[package]
name = "tinio-store-redb"
version.workspace = true
edition.workspace = true
description = "Shared redb implementation for the tinio storage backends: the table layer and the relocated database driver"
publish = false

[dependencies]
async-trait.workspace = true
bytes.workspace = true
derive_more = { workspace = true, features = ["full"] }
futures.workspace = true
parse-display.workspace = true
redb.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }
tracing.workspace = true

tinio-core.workspace = true

[features]
testing = ["tinio-core/testing"]

[dev-dependencies]
tempfile.workspace = true
tinio-store-redb = { path = ".", features = ["testing"] }
tracing-subscriber.workspace = true
tinio-util = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }

[lints.clippy]
absolute_paths = "warn"
allow_attributes = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

[lints.rust]
unsafe_code = "forbid"
