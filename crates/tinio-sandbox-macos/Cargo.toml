[package]
name = "tinio-sandbox-macos"
version.workspace = true
edition.workspace = true
description = "macOS confinement for tinio: a Seatbelt (SBPL) profile applied by sandbox-exec or in-process"
publish = false

[dependencies]
handlebars.workspace = true
parse-display.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

tinio-sandbox-core.workspace = true
tinio-util = { workspace = true, features = ["render"] }

[dev-dependencies]
tempfile.workspace = true

tinio-util = { workspace = true, features = ["testing"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["pipe", "process"] }
signal-hook = { workspace = true, features = ["iterator"] }
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "rt"] }

[lints.clippy]
absolute_paths = "warn"
allow_attributes = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

[lints.rust]
unsafe_code = "deny"
