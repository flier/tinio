[package]
name = "tinio-core"
version.workspace = true
edition.workspace = true
description = "Storage backend contract for tinio: domain errors, the async Storage trait, and backend-agnostic key validation"
publish = false

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
derive_more = { workspace = true, features = ["full"] }
futures.workspace = true
garde.workspace = true
hex.workspace = true
md-5.workspace = true
parse-display.workspace = true
percent-encoding.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, optional = true }
sha2.workspace = true
sqlx = { workspace = true, optional = true, default-features = false, features = [
    "derive",
    "json",
    "postgres",
] }
thiserror.workspace = true
tracing.workspace = true
unicode-properties = { workspace = true, features = ["general-category"] }
uuid = { workspace = true, features = ["v4"] }

[features]
sqlx = ["dep:sqlx", "dep:serde_json"]

[dev-dependencies]
proptest.workspace = true
tinio-util = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }

[package.metadata.cargo-machete]
# false positive: package md-5 has lib name md5, used in etag.rs
ignored = ["md-5"]

[lints.clippy]
absolute_paths = "warn"
allow_attributes = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

[lints.rust]
unsafe_code = "forbid"
