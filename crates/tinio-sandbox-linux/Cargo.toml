[package]
name = "tinio-sandbox-linux"
version.workspace = true
edition.workspace = true
description = "Linux mount-namespace confinement for tinio"
publish = false

[dependencies]
hex.workspace = true
linux-raw-sys = { workspace = true, features = ["prctl", "ptrace"] }
prometheus.workspace = true
rustix = { workspace = true, features = [
    "fs",
    "mount",
    "pipe",
    "process",
    "runtime",
    "thread",
] }
sha2.workspace = true
tracing.workspace = true

tinio-sandbox-core.workspace = true

[dev-dependencies]
tinio-sandbox-linux = { path = ".", features = ["testing"] }
tempfile.workspace = true
tinio-util = { workspace = true, features = ["testing"] }

[features]
testing = []

[lints.clippy]
absolute_paths = "warn"
allow_attributes = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

[lints.rust]
unsafe_code = "deny"
