[package]
name = "tinio-config"
version.workspace = true
edition.workspace = true
description = "Configuration and credential resolution for tinio (TOML config, .env, env vars, CLI flags)"
publish = false

[dependencies]
derive_more = { workspace = true, features = ["full"] }
dirs.workspace = true
dotenvy.workspace = true
garde = { workspace = true, features = ["derive", "regex", "url"] }
getrandom.workspace = true
hex.workspace = true
humantime-serde.workspace = true
parse-display.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_ignored.workspace = true
sha2.workspace = true
smart-default.workspace = true
thiserror.workspace = true
toml.workspace = true

tinio-core.workspace = true
tinio-util.workspace = true

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
tinio-winsec.workspace = true

[package.metadata.cargo-machete]
# false positive: used via serde `with = "humantime_serde"` attributes (scanner.rs)
ignored = ["humantime-serde"]

[lints.clippy]
absolute_paths = "warn"
allow_attributes = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

[lints.rust]
unsafe_code = "forbid"
