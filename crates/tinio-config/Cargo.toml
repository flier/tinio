[package]
name = "tinio-config"
version.workspace = true
edition.workspace = true
description = "Configuration and credential resolution for tinio (TOML config, .env, env vars, CLI flags)"
publish = false

[dependencies]
dotenvy.workspace = true
garde = { workspace = true, features = ["derive", "regex", "url"] }
humantime-serde.workspace = true
parse-display.workspace = true
secrecy = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_ignored.workspace = true
smart-default.workspace = true
thiserror.workspace = true
toml.workspace = true

tinio-core.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package.metadata.cargo-machete]
# false positive: used via serde `with = "humantime_serde"` attributes (scanner.rs)
ignored = ["humantime-serde"]

[lints.rust]
unsafe_code = "forbid"
