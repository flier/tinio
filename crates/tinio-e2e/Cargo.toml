[package]
name = "tinio-e2e"
version.workspace = true
edition.workspace = true
description = "BDD acceptance suite: cucumber scenarios over the in-process tinio server"
publish = false

[dependencies]
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "net",
    "io-util",
    "sync",
] }

[dev-dependencies]
assert_cmd = { workspace = true }
bzip2 = { workspace = true }
cucumber = { workspace = true, features = ["output-json", "tracing"] }
flate2 = { workspace = true }
futures = { workspace = true }
hmac = { workspace = true }
http = { workspace = true }
hyper-util = { workspace = true, features = ["tokio"] }
md-5 = { workspace = true }
percent-encoding = { workspace = true }
secrecy = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

tinio-api = { path = "../tinio-api", default-features = false }
tinio-core = { path = "../tinio-core" }
tinio-fs = { path = "../tinio-fs" }
tinio-mem = { path = "../tinio-mem" }
tinio-sandbox = { path = "../tinio-sandbox" }
tinio-sandbox-windows = { workspace = true, features = ["testing"] }
tinio-server = { path = "../tinio-server" }
tinio-util = { path = "../tinio-util", features = ["testing"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }

[features]
parquet = ["tinio-server/select-parquet"]

[[test]]
name = "cucumber"
harness = false

# Spec↔tag traceability cross-check: a plain default-harness test target
# (no cucumber involvement), so `cargo test` runs it normally.
[[test]]
name = "traceability"

[lints.clippy]
absolute_paths = "warn"
