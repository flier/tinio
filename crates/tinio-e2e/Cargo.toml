[package]
name = "tinio-e2e"
version.workspace = true
edition.workspace = true
description = "BDD acceptance suite: cucumber scenarios over the in-process tinio server"
publish = false

[dependencies]
sqlx = { workspace = true, optional = true, features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls-ring-native-roots",
] }
tinio-pg = { path = "../tinio-pg", optional = true }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "net",
    "io-util",
    "sync",
] }

[dev-dependencies]
assert_cmd = { workspace = true }
bzip2 = { workspace = true }
cucumber = { workspace = true, features = ["output-json", "tracing"] }
flate2 = { workspace = true }
futures = { workspace = true }
http = { workspace = true }
hyper-util = { workspace = true, features = ["tokio"] }
md-5 = { workspace = true }
percent-encoding = { workspace = true }
secrecy = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

tinio-api = { path = "../tinio-api", default-features = false }
tinio-core = { path = "../tinio-core" }
tinio-fs = { path = "../tinio-fs" }
tinio-mem = { path = "../tinio-mem" }
tinio-sandbox = { path = "../tinio-sandbox" }
tinio-sandbox-windows = { workspace = true, features = ["testing"] }
tinio-server = { path = "../tinio-server" }
tinio-util = { path = "../tinio-util", features = ["testing"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }

[features]
parquet = ["tinio-server/select-parquet"]
pg = ["dep:tinio-pg", "dep:sqlx", "tinio-pg/versioning", "tinio-pg/testing"]

[[test]]
name = "cucumber"
harness = false

[[test]]
name = "traceability"

[lints.clippy]
absolute_paths = "warn"
allow_attributes = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"
