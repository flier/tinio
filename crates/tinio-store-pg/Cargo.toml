[package]
name = "tinio-store-pg"
version.workspace = true
edition.workspace = true
description = "PostgreSQL implementation of the tinio persistence contracts: schema migrations, a driver pool, and the metadata, version, content and block planes"
publish = false

[features]
testing = ["tinio-core/testing"]

[dependencies]
async-trait.workspace = true
bytes.workspace = true
derive_more = { workspace = true, features = ["debug"] }
futures.workspace = true
hex.workspace = true
parse-display.workspace = true
prometheus.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = [
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio",
    "time",
    "tls-rustls-ring-native-roots",
] }
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync", "time"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

tinio-core = { workspace = true, features = ["sqlx"] }
tinio-util.workspace = true

[dev-dependencies]
tempfile.workspace = true
tinio-store-pg = { path = ".", features = ["testing"] }
tinio-util = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = [
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }

[lints.clippy]
absolute_paths = "warn"
allow_attributes = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

[lints.rust]
unsafe_code = "forbid"
