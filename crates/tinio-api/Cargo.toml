[package]
name = "tinio-api"
version.workspace = true
edition.workspace = true
description = "Management plane for tinio: axum router, control-channel transports, state file, status/stop client"
publish = false

[dependencies]
axum.workspace = true
derive_more = { workspace = true, features = ["debug"] }
getrandom.workspace = true
hex.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper = { workspace = true, features = ["client", "http1"] }
hyper-util = { workspace = true, features = [
    "server",
    "service",
    "tokio",
    "http1",
] }
prometheus.workspace = true
rustls-pemfile = { workspace = true, optional = true }
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha1.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting"] }
tokio = { workspace = true, features = ["rt", "net", "time", "sync", "macros"] }
tokio-rustls = { workspace = true, optional = true, features = [
    "ring",
    "tls12",
    "logging",
] }
tracing.workspace = true
utoipa = { workspace = true, optional = true, features = [
    "axum_extras",
    "macros",
] }

tinio-core.workspace = true
tinio-util.workspace = true

[features]
default = ["openapi", "tls"]
openapi = ["dep:utoipa"]
tls = ["dep:tokio-rustls", "dep:rustls-pemfile"]

[dev-dependencies]
tempfile.workspace = true
tower = { workspace = true, features = ["util"] }

tinio-util = { workspace = true, features = ["testing"] }

tokio = { workspace = true, features = ["rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
tinio-winsec.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[lints.clippy]
absolute_paths = "warn"

[lints.rust]
unsafe_code = "deny"
