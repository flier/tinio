[package]
name = "tinio"
version.workspace = true
edition.workspace = true
description = "Tinio: an S3-compatible local storage server (facade crate with the tinio binary and public re-export library)"

[dependencies]
tinio-api = { workspace = true, optional = true }
tinio-cli = { workspace = true, default-features = false }
tinio-config.workspace = true
tinio-core.workspace = true
tinio-server.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

tinio-fs.workspace = true
tinio-mem.workspace = true
tinio-sandbox.workspace = true
tinio-util = { workspace = true, features = ["testing"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[features]
default = ["full"]

full=[
    "acl",
    "api",
    "copy",
    "cors",
    "list-v1",
    "list-v2",
    "mem",
    "multipart",
    "openapi",
    "sandbox",
    "select",
    "tls",
    "versioning",
]

acl = ["tinio-server/acl"]
api = ["dep:tinio-api", "tinio-server/api", "tinio-cli/api"]
copy = ["tinio-server/copy"]
cors = ["tinio-server/cors"]
list-v1 = ["tinio-server/list-v1"]
list-v2 = ["tinio-server/list-v2"]
mem = ["tinio-cli/mem"]
multipart = ["tinio-server/multipart"]
openapi = ["tinio-api/openapi"]
otel = ["tinio-server/otel"]
sandbox = ["tinio-cli/sandbox"]
select = ["tinio-server/select"]
tls = ["tinio-api/tls", "tinio-cli/tls"]
versioning = ["tinio-server/versioning", "tinio-cli/versioning"]

[lints.clippy]
absolute_paths = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

[lints.rust]
unsafe_code = "deny"
