[package]
name = "tinio"
version.workspace = true
edition.workspace = true
description = "Tinio: an S3-compatible local storage server (facade crate with the tinio binary and public re-export library)"

[dependencies]
tinio-api = { workspace = true, optional = true }
# No features here: this crate's own list below is what names them, exactly as it
# names the server's. A pin that turned `sandbox` on unconditionally would make
# `--no-default-features` ship a confined binary anyway, and the feature-off legs
# (`crates/tinio/tests/doctor.rs`, `crates/tinio-server/tests/serve_sandbox_channels.rs`)
# key off the package's feature rather than this dependency's.
tinio-cli = { workspace = true, default-features = false }
tinio-config.workspace = true
tinio-core.workspace = true
tinio-server.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

tinio-fs.workspace = true
tinio-sandbox.workspace = true
tinio-util = { workspace = true, features = ["testing"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = [
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[features]
default = [
    "api",
    "mem",
    "multipart",
    "copy",
    "list-v1",
    "list-v2",
    "cors",
    "select",
    "acl",
    "openapi",
    "tls",
    "sandbox",
]
api = ["dep:tinio-api", "tinio-server/api", "tinio-cli/api"]
sandbox = ["tinio-cli/sandbox"]
openapi = ["tinio-api/openapi"]
tls = ["tinio-api/tls", "tinio-cli/tls"]
mem = ["tinio-cli/mem"]
multipart = ["tinio-server/multipart"]
copy = ["tinio-server/copy"]
list-v1 = ["tinio-server/list-v1"]
list-v2 = ["tinio-server/list-v2"]
# The three the workspace's `tinio-server` pin compiles out unless they are named here: the root
# manifest sets `default-features = false` on that dependency, so the facade's own list is what
# decides whether the shipped binary carries them — and the `@boto3`/`@external` scenarios drive
# the shipped binary, not the in-process server the e2e links (`crates/tinio-e2e` depends on
# `tinio-server` by path with its defaults on).
cors = ["tinio-server/cors"]
select = ["tinio-server/select"]
acl = ["tinio-server/acl"]
otel = ["tinio-server/otel"]

[lints.clippy]
absolute_paths = "warn"

[lints.rust]
unsafe_code = "deny"
