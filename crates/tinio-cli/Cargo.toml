[package]
name = "tinio-cli"
version.workspace = true
edition.workspace = true
description = "Command-line interface for tinio: server/start, status, stop, doctor"
publish = false

[dependencies]
clap = { workspace = true, features = [
    "derive",
    "env",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
either.workspace = true
futures.workspace = true
handlebars.workspace = true
hex.workspace = true
parse-display.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
service-manager.workspace = true
sha2.workspace = true
smart-default.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "net",
    "fs",
    "io-util",
    "time",
    "macros",
    "sync",
] }
tracing.workspace = true

tinio-api = { workspace = true, optional = true }
tinio-config.workspace = true
tinio-core.workspace = true
tinio-fs.workspace = true
tinio-mem = { workspace = true, optional = true }
tinio-sandbox.workspace = true
tinio-server = { workspace = true, features = ["acl"] }
tinio-util = { workspace = true, features = ["render"] }

[dev-dependencies]
tempfile.workspace = true
tinio-util = { workspace = true, features = ["testing"] }

[target.'cfg(unix)'.dependencies]
daemonize.workspace = true
rustix = { workspace = true, features = ["process", "fs"] }
sd-notify.workspace = true
signal-hook = { workspace = true, features = ["iterator"] }

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[features]
default = ["api", "mem", "sandbox"]
api = ["dep:tinio-api"]
mem = ["dep:tinio-mem"]
sandbox = ["api"]
tls = ["api", "tinio-api/tls"]

[lints.clippy]
absolute_paths = "warn"

[lints.rust]
unsafe_code = "deny"
