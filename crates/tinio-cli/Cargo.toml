[package]
name = "tinio-cli"
version.workspace = true
edition.workspace = true
description = "Command-line interface for tinio: server/start, status, stop, doctor"
publish = false

[dependencies]
clap = { workspace = true, features = ["derive"] }
thiserror.workspace = true

tinio-api = { workspace = true, optional = true }
tinio-config.workspace = true
tinio-core.workspace = true
tinio-fs.workspace = true
tinio-mem = { workspace = true, optional = true }
tinio-server.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console"] }

[dev-dependencies]
tinio-core = { workspace = true, features = ["testing"] }

[features]
default = ["api", "mem"]
api = ["dep:tinio-api"]
mem = ["dep:tinio-mem"]

[lints.rust]
unsafe_code = "forbid"
