[package]
name = "tinio-cli"
version.workspace = true
edition.workspace = true
description = "Command-line interface for tinio: server/start, status, stop, doctor"
publish = false

[dependencies]
async-trait.workspace = true
clap = { workspace = true, features = [
    "derive",
    "env",
    "error-context",
    "help",
    "std",
    "suggestions",
    "usage",
] }
dirs.workspace = true
dotenvy.workspace = true
either.workspace = true
futures.workspace = true
garde = { workspace = true, features = ["derive", "url"] }
getrandom.workspace = true
handlebars.workspace = true
hex.workspace = true
http.workspace = true
humantime-serde.workspace = true
parse-display.workspace = true
prometheus.workspace = true
secrecy.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_ignored.workspace = true
serde_json.workspace = true
service-manager.workspace = true
sha2.workspace = true
smart-default.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "net",
    "fs",
    "io-util",
    "time",
    "macros",
    "sync",
] }
toml.workspace = true
tracing.workspace = true

tinio-api = { workspace = true, optional = true }
tinio-core.workspace = true
tinio-fs.workspace = true
tinio-lifecycle = { workspace = true, optional = true }
tinio-mem = { workspace = true, optional = true }
tinio-pg = { workspace = true, optional = true }
tinio-sandbox.workspace = true
tinio-server = { workspace = true, features = ["acl", "config"] }
tinio-util = { workspace = true, features = ["render", "state"] }

[dev-dependencies]
tempfile.workspace = true
tinio-mem.workspace = true
tinio-store-pg = { workspace = true, features = ["testing"] }
tinio-util = { workspace = true, features = ["testing"] }

[target.'cfg(unix)'.dependencies]
daemonize.workspace = true
rustix = { workspace = true, features = ["process", "fs"] }
sd-notify.workspace = true
signal-hook = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Threading",
] }

[features]
default = ["api", "mem", "sandbox", "versioning"]
api = ["dep:tinio-api", "tinio-api/lifecycle"]
lifecycle = ["api", "dep:tinio-lifecycle"]
mem = ["dep:tinio-mem"]
otel = ["tinio-server/otel"]
pg = ["dep:tinio-pg"]
sandbox = ["api"]
tls = ["api", "tinio-api/tls"]
versioning = ["tinio-server/versioning", "tinio-pg?/versioning"]

[lints.clippy]
absolute_paths = "warn"
allow_attributes = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

[lints.rust]
unsafe_code = "deny"
