[package]
name = "tinio-server"
version.workspace = true
edition.workspace = true
description = "S3 compatibility layer for tinio: s3s protocol mapping over the tinio-core storage contract"
publish = false

[dependencies]
hyper.workspace = true
hyper-util.workspace = true
lazy_static.workspace = true
mime_guess.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
prometheus.workspace = true
s3s.workspace = true
thiserror.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }

tinio-api = { workspace = true, optional = true }
tinio-config.workspace = true
tinio-core.workspace = true

[dev-dependencies]
tinio-core = { workspace = true, features = ["testing"] }

[features]
default = ["multipart", "copy", "list-v1", "list-v2"]
multipart = []
copy = []
list-v1 = []
list-v2 = []
api = ["dep:tinio-api"]
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

[lints.rust]
unsafe_code = "forbid"
