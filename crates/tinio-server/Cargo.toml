[package]
name = "tinio-server"
version.workspace = true
edition.workspace = true
description = "S3 compatibility layer for tinio: s3s protocol mapping over the tinio-core storage contract"
publish = false

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
cfg-if = { workspace = true, optional = true }
derive_more = { workspace = true, features = ["deref", "display", "eq"] }
futures.workspace = true
garde = { workspace = true, optional = true, features = [
    "derive",
    "regex",
] }
http.workspace = true
http-body.workspace = true
itoa.workspace = true
hyper.workspace = true
hyper-util = { workspace = true, features = [
    "server-auto",
    "tokio",
    "http1",
    "http2",
] }
mime_guess.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true, features = [
    "grpc-tonic",
    "tls-ring",
    "tls-webpki-roots",
] }
opentelemetry_sdk = { workspace = true, optional = true }
parse-display.workspace = true
prometheus.workspace = true
rayon = { workspace = true, optional = true }
s3s.workspace = true
secrecy.workspace = true
serde = { workspace = true, optional = true, features = ["derive"] }
smart-default.workspace = true
thiserror.workspace = true
thread-priority.workspace = true
time.workspace = true
tokio = { workspace = true, features = [
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
tower.workspace = true
tracing.workspace = true
tracing-opentelemetry = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = [
    "registry",
    "fmt",
    "json",
    "env-filter",
] }

tinio-api = { workspace = true, optional = true }
tinio-auth = { workspace = true, optional = true }
tinio-core.workspace = true
tinio-fs = { workspace = true, optional = true }
tinio-mem = { workspace = true, optional = true }
tinio-select = { workspace = true, optional = true }
tinio-util.workspace = true

[dev-dependencies]
bytes.workspace = true
clap = { workspace = true, features = [
    "derive",
    "error-context",
    "std",
    "suggestions",
    "usage",
] }
criterion = { workspace = true, features = [
    "async_tokio",
    "rayon",
    "cargo_bench_support",
] }
futures.workspace = true
hex.workspace = true
http.workspace = true
md-5.workspace = true
opentelemetry_sdk = { workspace = true, features = ["testing"] }
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
toml.workspace = true

tinio-api.workspace = true
tinio-fs = { workspace = true, features = ["testing"] }
tinio-mem.workspace = true
tinio-sandbox.workspace = true
tinio-sandbox-linux = { workspace = true, features = ["testing"] }
tinio-sandbox-windows = { workspace = true, features = ["testing"] }
tinio-store-redb = { workspace = true, features = ["testing"] }
tinio-util = { workspace = true, features = ["bench", "state", "testing"] }

[[test]]
name = "otel_round_trip"
required-features = ["otel"]

[[test]]
name = "sandbox_e2e"
required-features = ["sandbox"]

[[test]]
name = "sandbox_e2e_windows"
required-features = ["sandbox"]

[[test]]
name = "sandbox_macos_e2e"
required-features = ["sandbox"]

[[bench]]
name = "multipart_assembly"
harness = false

[[bench]]
name = "listing"
harness = false

[[bench]]
name = "pipeline"
harness = false

[features]
default = [
    "multipart",
    "copy",
    "list-v1",
    "list-v2",
    "cors",
    "select",
    "acl",
    "sandbox",
    "versioning",
]
sandbox = []
multipart = []
copy = ["dep:tinio-auth"]
list-v1 = []
list-v2 = []
cors = []
lifecycle = []
object-lock = ["versioning"]
select = ["dep:tinio-select", "dep:cfg-if", "dep:rayon"]
select-parquet = ["select", "tinio-select/parquet"]
acl = ["dep:tinio-auth"]
api = ["dep:tinio-api"]
versioning = [
    "dep:tinio-fs",
    "dep:tinio-mem",
    "tinio-fs/versioning",
    "tinio-mem/versioning",
]
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry-otlp",
    "dep:opentelemetry_sdk",
    "dep:tracing-opentelemetry",
]
config = ["dep:serde", "dep:garde"]

[lints.clippy]
absolute_paths = "warn"
allow_attributes = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

[lints.rust]
unsafe_code = "forbid"
