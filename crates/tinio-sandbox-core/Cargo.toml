[package]
name = "tinio-sandbox-core"
version.workspace = true
edition.workspace = true
description = "The confinement contract for tinio: the Backend trait, its vocabulary, and the launcher machinery"
publish = false

[dependencies]
bytes.workspace = true
derive_more = { workspace = true, features = ["debug"] }
parse-display.workspace = true
prometheus.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sse-core.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true

tinio-core.workspace = true
tinio-util.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "pipe", "process"] }

[dev-dependencies]
tinio-util = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }
tracing-subscriber.workspace = true

[lints.clippy]
absolute_paths = "warn"
allow_attributes = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

[lints.rust]
unsafe_code = "forbid"
