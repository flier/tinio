[package]
name = "tinio-mem"
version.workspace = true
edition.workspace = true
description = "In-memory storage backend for tinio (reference impl + no-directory CLI mode)"
publish = false

[dependencies]
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
redb.workspace = true
thiserror.workspace = true
uuid = { workspace = true, features = ["v4"] }

tinio-core.workspace = true
tinio-store-redb.workspace = true
tinio-version = { workspace = true, optional = true }

[features]
default = []
versioning = ["dep:tinio-version"]

[dev-dependencies]
tinio-mem = { path = ".", features = ["versioning"] }
tinio-util = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }

[lints.clippy]
absolute_paths = "warn"

[lints.rust]
unsafe_code = "forbid"
