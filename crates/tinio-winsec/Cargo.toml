[package]
name = "tinio-winsec"
version.workspace = true
edition.workspace = true
description = "Current-user-only Windows DACLs shared by tinio config files and the management plane"
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[lints.clippy]
absolute_paths = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

[lints.rust]
unsafe_code = "deny"
