[package]
name = "tinio-fs"
version.workspace = true
edition.workspace = true
description = "Filesystem backend for tinio: implements the tinio-core Storage contract over the local filesystem"
publish = false

[dependencies]
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["full"] }
uuid = { workspace = true, features = ["v4"] }

tinio-core.workspace = true

[dev-dependencies]
criterion.workspace = true
dhat.workspace = true
proptest.workspace = true
tempfile.workspace = true

tinio-core = { workspace = true, features = ["testing"] }

[lints.rust]
unsafe_code = "forbid"
