[package]
name = "tinio-fs"
version.workspace = true
edition.workspace = true
description = "Filesystem backend for tinio: implements the tinio-core Storage contract over the local filesystem"
publish = false

[dependencies]
async-trait.workspace = true
bytes.workspace = true
derive_more = { workspace = true, features = ["full"] }
futures.workspace = true
garde = { workspace = true, features = ["derive"] }
getset.workspace = true
hex.workspace = true
md-5.workspace = true
moka = { workspace = true, features = ["sync", "atomic64"] }
redb.workspace = true
rustix = { workspace = true, features = ["fs"] }
smart-default.workspace = true
strict-path = { workspace = true, features = ["junctions"] }
thiserror.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

tinio-core.workspace = true
tinio-util.workspace = true

[target.'cfg(windows)'.dependencies]
winapi-util.workspace = true

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }
dhat.workspace = true
proptest.workspace = true
tempfile.workspace = true

tinio-util = { workspace = true, features = ["testing"] }

[[bench]]
name = "streaming"
harness = false

[[bench]]
name = "meta"
harness = false

[[bench]]
name = "set_batch"
harness = false

[lints.rust]
unsafe_code = "forbid"
