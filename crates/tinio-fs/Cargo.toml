[package]
name = "tinio-fs"
version.workspace = true
edition.workspace = true
description = "Filesystem backend for tinio: implements the tinio-core Storage contract over the local filesystem"
publish = false

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
derive_more = { workspace = true, features = ["full"] }
futures.workspace = true
garde = { workspace = true, features = ["derive"] }
getset.workspace = true
hex.workspace = true
md-5.workspace = true
redb.workspace = true
smart-default.workspace = true
strict-path = { workspace = true, features = ["junctions"] }
thiserror.workspace = true
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

tinio-core.workspace = true
tinio-store.workspace = true
tinio-util.workspace = true

[target.'cfg(unix)'.dependencies]
moka = { workspace = true, features = ["sync", "atomic64"] }
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
winapi-util.workspace = true

[dev-dependencies]
criterion = { workspace = true, features = [
    "async_tokio",
    "rayon",
    "cargo_bench_support",
] }
dhat.workspace = true
proptest.workspace = true
tempfile.workspace = true

tinio-util = { workspace = true, features = ["testing"] }

[[bench]]
name = "streaming"
harness = false

[[bench]]
name = "meta"
harness = false

[[bench]]
name = "set_batch"
harness = false

[package.metadata.cargo-machete]
# false positive: package md-5 has lib name md5, used in write.rs/multipart.rs
ignored = ["md-5"]

[lints.rust]
unsafe_code = "forbid"
