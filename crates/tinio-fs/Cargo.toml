[package]
name = "tinio-fs"
version.workspace = true
edition.workspace = true
description = "Filesystem backend for tinio: implements the tinio-core Storage contract over the local filesystem"
publish = false

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
derive_more = { workspace = true, features = ["full"] }
futures.workspace = true
garde = { workspace = true, features = ["derive"] }
getset.workspace = true
hex.workspace = true
md-5.workspace = true
prometheus.workspace = true
redb.workspace = true
sha2.workspace = true
smart-default.workspace = true
soft-canonicalize.workspace = true
strict-path = { workspace = true, features = ["junctions"] }
thiserror.workspace = true
tokio = { workspace = true, features = [
    "fs",
    "io-util",
    "macros",
    "rt",
    "rt-multi-thread",
    "sync",
    "time",
] }
tracing.workspace = true
uuid = { workspace = true, features = ["v4"] }

tinio-blob.workspace = true
tinio-core.workspace = true
tinio-ops.workspace = true
tinio-store-redb.workspace = true
tinio-util.workspace = true
tinio-version.workspace = true

[features]
default = []
tier = []
versioning = []
testing = ["tinio-core/testing", "tinio-store-redb/testing"]

[target.'cfg(unix)'.dependencies]
moka = { workspace = true, features = ["sync", "atomic64"] }
rustix = { workspace = true, features = ["fs"] }

[target.'cfg(windows)'.dependencies]
winapi-util.workspace = true

[dev-dependencies]
criterion = { workspace = true, features = [
    "async_tokio",
    "rayon",
    "cargo_bench_support",
] }
proptest.workspace = true
tempfile.workspace = true

tinio-bench.workspace = true
tinio-util = { workspace = true, features = ["bench", "testing"] }
tinio-fs = { path = ".", features = ["versioning", "testing"] }

[[bench]]
name = "streaming"
harness = false

[[bench]]
name = "meta"
harness = false

[[bench]]
name = "set_batch"
harness = false

[[bench]]
name = "ab"
harness = false

[package.metadata.cargo-machete]
# false positive: package md-5 has lib name md5, used in write.rs/multipart.rs
ignored = ["md-5"]

[lints.clippy]
absolute_paths = "warn"
allow_attributes = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
unwrap_used = "warn"

[lints.rust]
unsafe_code = "forbid"
