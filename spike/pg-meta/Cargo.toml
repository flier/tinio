[package]
name = "pg-meta"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tokio-postgres = "0.7"

tinio-core = { path = "../../crates/tinio-core" }
tinio-util = { path = "../../crates/tinio-util", default-features = false }

# The library carries the store contract and needs no test support; only the
# gate driver runs the shared conformance suite. The split keeps
# `cargo check --lib --no-default-features` a real check of the store alone.
[features]
default = ["conformance"]
conformance = ["tinio-util/testing"]

[workspace]
