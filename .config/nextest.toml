# CI test-leg runner profile — selected by .github/actions/run-test-leg
# via `--profile ci`. A nextest runner profile is independent of the
# Cargo build profile (--cargo-profile ci): retries/fail-fast live here
# so the test commands stay one line per mode.
[profile.ci]
fail-fast = false
retries = 2

# The three platform confinement suites are out of THIS leg's run and nothing
# else's: they are fail-not-skip on purpose (`docs/tests.md`, "fail, never
# skip"), so on a runner that cannot confine they fail rather than skip —
# ubuntu's AppArmor default refuses the unprivileged user namespace
# `tinio-sandbox-linux::jail` and `tinio-server::sandbox_e2e` need, and a hosted
# Windows runner owes the console `tinio-sandbox-windows::signals` delivers its
# stop to. Their gate is the platform script on a host that owes the
# precondition (`crates/tinio-sandbox-linux/scripts/wsl-chroot.sh` /
# `crates/tinio-sandbox-windows/scripts/verify-windows.ps1`), and the WSL2 script
# runs `sandbox_e2e` as plain `cargo test -p tinio-server --test sandbox_e2e`, so
# this filter never reaches it. `sandbox_macos_e2e` is deliberately absent:
# Seatbelt is what the hosted macOS runner owes, and that leg is the CI
# acceptance there (design §12). All still compile and lint in every leg (a
# build break stays red), and a host that can confine runs them with
# `--ignore-default-filter` — or without `--profile ci`.
#
# `binary(<name>)`, never `binary(<package>::<name>)`: the qualified form is
# not a binary name, and nextest answers `failed to parse
# profile.ci.default-filter` / `operator didn't match any binary names` — the
# whole leg fails before a test runs (exit 96; 94 when passed via `-E`).
# Verified against cargo-nextest 0.9.146.
default-filter = "not binary(jail) and not binary(sandbox_e2e) and not binary(signals)"

# The store's database-backed legs run under a pinned thread count. Each leg
# opens a 4-connection pool to its own scratch database, so a runner whose
# test-thread count outruns the fixture's `max_connections` fails the whole
# suite with `sorry, too many clients already` — reproduced red at 64 threads on
# a 28-core host, green at 4 (the 2026-10-13 review's finding 1; `docs/tests.md`,
# "Rust"). A test group is the nextest shape of that pin: `max-threads = 4` is a
# logical semaphore over the matching tests, independent of the run's thread
# count. The override lives in `profile.default`, which every custom profile
# inherits (`ci` included, nextest >= 0.9.115), and a test group needs
# cargo-nextest >= 0.9.48 — both below the 0.9.146 this file is verified
# against. The CI `pg` job runs plain `cargo test`, where this file does not
# apply, so it carries `--test-threads=4` on its own steps; this group is the
# nextest path a developer takes against the live fixture.
[test-groups]
pg-db = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'package(tinio-store-pg)'
test-group = 'pg-db'
